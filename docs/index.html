<script type="text/babel" data-presets="react">
const __TWEAKS_STYLE = `
  .twk-panel{position:fixed;right:16px;bottom:16px;z-index:2147483646;width:280px;
    max-height:calc(100vh - 32px);display:flex;flex-direction:column;
    transform:scale(var(--dc-inv-zoom,1));transform-origin:bottom right;
    background:rgba(250,249,247,.78);color:#29261b;
    -webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);
    border:.5px solid rgba(255,255,255,.6);border-radius:14px;
    box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 12px 40px rgba(0,0,0,.18);
    font:11.5px/1.4 ui-sans-serif,system-ui,-apple-system,sans-serif;overflow:hidden}
  .twk-hd{display:flex;align-items:center;justify-content:space-between;
    padding:10px 8px 10px 14px;cursor:move;user-select:none}
  .twk-hd b{font-size:12px;font-weight:600;letter-spacing:.01em}
  .twk-x{appearance:none;border:0;background:transparent;color:rgba(41,38,27,.55);
    width:22px;height:22px;border-radius:6px;cursor:default;font-size:13px;line-height:1}
  .twk-x:hover{background:rgba(0,0,0,.06);color:#29261b}
  .twk-body{padding:2px 14px 14px;display:flex;flex-direction:column;gap:10px;
    overflow-y:auto;overflow-x:hidden;min-height:0}
  .twk-row{display:flex;flex-direction:column;gap:5px}
  .twk-row-h{flex-direction:row;align-items:center;justify-content:space-between;gap:10px}
  .twk-lbl{display:flex;justify-content:space-between;align-items:baseline;color:rgba(41,38,27,.72)}
  .twk-lbl>span:first-child{font-weight:500}
  .twk-sect{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
    color:rgba(41,38,27,.45);padding:10px 0 0}
  .twk-sect:first-child{padding-top:0}
  .twk-seg{position:relative;display:flex;padding:2px;border-radius:8px;
    background:rgba(0,0,0,.06);user-select:none}
  .twk-seg-thumb{position:absolute;top:2px;bottom:2px;border-radius:6px;
    background:rgba(255,255,255,.9);box-shadow:0 1px 2px rgba(0,0,0,.12);
    transition:left .15s cubic-bezier(.3,.7,.4,1),width .15s}
  .twk-seg button{appearance:none;position:relative;z-index:1;flex:1;border:0;
    background:transparent;color:inherit;font:inherit;font-weight:500;min-height:22px;
    border-radius:6px;cursor:default;padding:4px 6px;line-height:1.2}
  .twk-toggle{position:relative;width:32px;height:18px;border:0;border-radius:999px;
    background:rgba(0,0,0,.15);transition:background .15s;cursor:default;padding:0}
  .twk-toggle[data-on="1"]{background:#34c759}
  .twk-toggle i{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;
    background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
  .twk-toggle[data-on="1"] i{transform:translateX(14px)}
`;

function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    offsetRef.current = {
      x: Math.min(Math.max(PAD, window.innerWidth - w - PAD), Math.max(PAD, offsetRef.current.x)),
      y: Math.min(Math.max(PAD, window.innerHeight - h - PAD), Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = { x: startRight - (ev.clientX - sx), y: startBottom - (ev.clientY - sy) };
      clampToViewport();
    };
    const up = () => { window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', up); };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" onMouseDown={(e) => e.stopPropagation()} onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

function TweakSection({ label, children }) {
  return <><div className="twk-sect">{label}</div>{children}</>;
}

function TweakRow({ label, children }) {
  return <div className="twk-row"><div className="twk-lbl"><span>{label}</span></div>{children}</div>;
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'} onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;
  const trackRef = React.useRef(null);

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const i = Math.floor(((clientX - r.left - 2) / (r.width - 4)) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    const v0 = segAt(e.clientX);
    if (v0 !== value) onChange(v0);
    const move = (ev) => { if (trackRef.current) { const v = segAt(ev.clientX); if (v !== value) onChange(v); } };
    const up = () => { window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown} className="twk-seg">
        <div className="twk-seg-thumb" style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`, width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>{o.label}</button>)}
      </div>
    </TweakRow>
  );
}

Object.assign(window, { useTweaks, TweaksPanel, TweakSection, TweakRow, TweakToggle, TweakRadio });
</script>

function NewsApp({ tweaks }) {
  const T = THEMES[tweaks.theme] || THEMES.sunny;
  const D = DENSITY[tweaks.density] || DENSITY.regular;
  const data = window.TODAY_LETTER_DATA;

  const [tab, setTab] = React.useState('today');
  const [expanded, setExpanded] = React.useState({ top: true });
  const [picked, setPicked] = React.useState({});
  const [bookmarked, setBookmarked] = React.useState({ top: true });
  const [pageBookmark, setPageBookmark] = React.useState(false);

  const toggle = (id) => setExpanded(p => ({ ...p, [id]: !p[id] }));
  const pick   = (id, r) => setPicked(p => ({ ...p, [id]: p[id] === r ? null : r }));
  const bm     = (id) => setBookmarked(p => ({ ...p, [id]: !p[id] }));

  return (
    <div style={{ background:T.bg, minHeight:'100%', fontFamily:SCALE.font.sans, color:T.ink }}>
      <Header T={T} D={D} data={data} bookmarked={pageBookmark} onBookmark={() => setPageBookmark(b => !b)} />
      {tab === 'today' && <Greeting T={T} D={D} data={data} showMascot={tweaks.illustrations} />}
      <Tabs T={T} D={D} value={tab} onChange={setTab} />

      {tab === 'today' && (
        <div style={{ display:'flex', flexDirection:'column', gap:D.gap, paddingBottom:24 }}>
          <TopCard T={T} D={D} story={data.topStory} expanded={!!expanded.top} onToggle={() => toggle('top')} showIllust={tweaks.illustrations} />
          <div style={{ margin:`6px ${D.pagePad}px 0`, display:'flex', alignItems:'center', gap:10 }}>
            <div style={{ flex:1, height:1, background:T.line }} />
            <span style={{ fontFamily:SCALE.font.mono, fontSize:10, color:T.inkFaint, letterSpacing:1.2 }}>오늘 다룰 뉴스 {data.stories.length}건</span>
            <div style={{ flex:1, height:1, background:T.line }} />
          </div>
          {data.stories.map((s,i) => (
            <React.Fragment key={s.id}>
              <StoryCard T={T} D={D} story={s} expanded={!!expanded[s.id]} onToggle={() => toggle(s.id)} showIllust={tweaks.illustrations} picked={picked[s.id]} onPick={(r) => pick(s.id,r)} bookmarked={!!bookmarked[s.id]} onBookmark={() => bm(s.id)} />
              {i === 1 && <WordOfDay T={T} D={D} w={data.wordOfDay} />}
            </React.Fragment>
          ))}
          <Footer T={T} D={D} data={data} />
        </div>
      )}

      {tab === 'week' && <WeekView T={T} D={D} data={data} />}
      {tab === 'topic' && (
        <div style={{ padding:'20px', textAlign:'center', color:T.inkFaint }}>
          <Mascot color={T.mascotBody} size={72} blink />
          <div style={{ marginTop:12, fontSize:13 }}>토픽별 모아보기는 곧 만나요</div>
        </div>
      )}
    </div>
  );
}

function Root() {
  const TWEAK_DEFAULTS = { theme: 'sunny', density: 'regular', illustrations: true };
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  return (
    <>
      <div className="scroll-area">
        <IOSDevice width={402} height={874}>
          <NewsApp tweaks={t} />
        </IOSDevice>
      </div>
      <TweaksPanel title="Tweaks">
        <TweakSection label="컬러 테마" />
        <TweakRadio label="테마" value={t.theme} options={['sunny','mint','lilac']} onChange={(v) => setTweak('theme', v)} />
        <TweakSection label="레이아웃" />
        <TweakRadio label="밀도" value={t.density} options={['compact','regular','comfy']} onChange={(v) => setTweak('density', v)} />
        <TweakToggle label="일러스트 표시" value={t.illustrations} onChange={(v) => setTweak('illustrations', v)} />
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
</script>
</body>
</html>
